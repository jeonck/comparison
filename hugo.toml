baseURL = 'https://comparison.metacog.co.kr/'
locale = 'en-us'
title = 'IT Comparison'
theme = 'PaperMod'
paginate = 10

[params]
  env = 'production'
  title = 'IT Comparison'
  description = 'Side-by-side comparisons of IT concepts and terms, illustrated with diagrams and tables.'
  author = 'jeonck'
  defaultTheme = 'auto'
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = false
  tocopen = false

  [params.homeInfoParams]
    Title = 'IT Comparison'
    Content = 'Side-by-side comparisons of IT concepts and terms — each with a diagram and a table. Add a term below to request a new comparison.'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/jeonck/comparison'

[menu]
  [[menu.main]]
    identifier = 'input'
    name = 'Compare a Term ✏️'
    url = 'https://github.com/jeonck/comparison/edit/main/input/term.md'
    weight = 5
  [[menu.main]]
    identifier = 'posts'
    name = 'Posts'
    url = '/posts/'
    weight = 10
  [[menu.main]]
    identifier = 'tags'
    name = 'Tags'
    url = '/tags/'
    weight = 20
  [[menu.main]]
    identifier = 'search'
    name = 'Search'
    url = '/search/'
    weight = 30

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
